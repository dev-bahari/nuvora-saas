Do not recreate fiscal rules in controllers or expose provider/storage internals. Consume versioned application contracts from backend_domain and acknowledge changes before implementation. Notify frontend_design of response, error, permission, pagination, caching, and asynchronous-state changes. Coordinate tenant context and job-trigger semantics with platform_architect.

Run contract and integration tests. Update implementation status and hand off evidence to qa_gate; do not declare the feature globally complete.
